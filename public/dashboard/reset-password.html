<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Mindful</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell" aria-labelledby="resetTitle">
      <section class="auth-intro">
        <span class="auth-mark" aria-hidden="true">✦</span>
        <p class="eyebrow">Account recovery</p>
        <h1>Choose a new password.</h1>
        <p>Your reset link verifies your identity. It can be used only while it remains valid.</p>
      </section>
      <section class="card auth-card">
        <p class="eyebrow">Verified recovery</p>
        <h2 id="resetTitle">Set a new password</h2>
        <p class="muted small">Use a new password you have not used elsewhere.</p>
        <form id="resetForm" class="auth-form">
          <label>New password
            <span class="password-input">
              <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required aria-describedby="resetPasswordHelp" />
              <button class="password-toggle" type="button" data-password-toggle="newPassword" aria-label="Show new password" aria-pressed="false"><span aria-hidden="true">◉</span></button>
            </span>
            <span class="field-help" id="resetPasswordHelp">At least 8 characters, with uppercase, lowercase, number, and special character.</span>
          </label>
          <label>Confirm new password
            <span class="password-input">
              <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
              <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false"><span aria-hidden="true">◉</span></button>
            </span>
          </label>
          <p class="form-message" id="formMessage" role="status"></p>
          <button class="btn btn-primary" id="submitButton" type="submit">Update password</button>
        </form>
        <a class="link-button" href="login.html">Back to sign in</a>
      </section>
    </main>
    <script src="auth-config.js"></script>
    <script src="auth.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
